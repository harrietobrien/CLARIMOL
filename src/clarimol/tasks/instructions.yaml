functional_group:
  - >-
    Does the molecule represented by this SMILES contain
    the specified functional group? Respond with 'Yes' or 'No'.

    **SMILES:** {smiles}

    **FUNCTIONAL GROUP:** {fg_info}
  - >-
    Determine the inclusion of the indicated functional group
    in the given SMILES string. Answer 'Yes' or 'No'.

    **SMILES:** {smiles}

    **FUNCTIONAL GROUP:** {fg_info}
  - >-
    Given the SMILES below, determine whether the functional group
    {fg_info} is present. Respond 'Yes' or 'No'.

    **SMILES:** {smiles}
  - >-
    Check if the molecule encoded by this SMILES includes the
    functional group {fg_info}. Answer with 'Yes' or 'No' only.

    **SMILES:** {smiles}
  - >-
    Is the functional group {fg_info} contained in the molecule
    represented by the following SMILES? Answer 'Yes' or 'No'.

    **SMILES:** {smiles}
  - >-
    Examine the SMILES string below and indicate whether it contains
    the functional group {fg_info}. Respond with only 'Yes' or 'No'.

    **SMILES:** {smiles}

ring_counting:
  - >-
    Assess the SMILES below and report how many rings consist of
    {ring_size} atoms. Give me the integer only.

    **SMILES:** {smiles}

    **SIZE OF RINGS:** {ring_size}
  - >-
    Calculate the count of {ring_size}-membered rings in the given
    SMILES string.

    **SMILES:** {smiles}

    **RING SIZE:** {ring_size}
  - >-
    How many {ring_size}-membered rings does the molecule encoded by
    this SMILES contain? Provide only the number.

    **SMILES:** {smiles}
  - >-
    Count the number of rings with exactly {ring_size} atoms in the
    molecule below. Answer with a single integer.

    **SMILES:** {smiles}
  - >-
    For the molecule represented by the following SMILES, determine
    how many {ring_size}-membered rings are present. Integer only.

    **SMILES:** {smiles}
  - >-
    Tell me the number of {ring_size}-membered rings in the molecule
    described by this SMILES string. Answer with just the count.

    **SMILES:** {smiles}

